<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Unit Operations Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap">
<style>
/* Tokens copied from shared/brand/cap-brand.css (CAP Brand Portal / CAPR 900-2). */
:root{
  --paper:#FFFFFF; --ink:#4D4D4D; --head:#63666A; --rule:#9EA2A2; --tint:#F1F2F2;
  --blue:#001489; --red:#BA0C2F;
  --f-title:"Rajdhani", Arial, sans-serif; --f-body:Arial, Helvetica, sans-serif;
  color-scheme:light;
}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:14.67px;line-height:1.2}
.wrap{max-width:960px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.titlerow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 24px}
.amonth{font-family:var(--f-title);font-weight:700;font-size:32px;line-height:1.05;color:var(--blue);letter-spacing:.02em}
h1{font-family:var(--f-title);font-weight:700;font-size:32px;line-height:1.05;color:var(--blue);margin:0}
.fy{margin:6px 0 0;font-size:18.67px;color:var(--ink);letter-spacing:.01em}
.fy .sep{color:var(--rule);padding:0 10px}
.pick{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:18px 0 0}
.pick label{font-size:13.33px;color:var(--head);display:flex;gap:8px;align-items:center}
.pick select{max-width:190px;font:inherit;font-size:14.67px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:3px;padding:6px 8px;min-height:36px}
.pick select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 0}
.kpi{border:1px solid var(--rule);border-radius:3px;padding:10px 14px}
.kpi .lab{font-size:12px;color:var(--head);letter-spacing:.03em}
.kpi .val{font-family:var(--f-title);font-weight:600;font-size:26px;white-space:nowrap;color:#000;line-height:1.1;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:13.33px;color:var(--ink)}
section.month{margin-top:26px}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;border-bottom:1.5px solid var(--head);padding-bottom:4px}
h2{font-weight:400;font-size:21.33px;color:var(--head);margin:0}
.sign{font-size:13.33px;color:var(--ink);white-space:nowrap}
.tblbox{overflow-x:auto}
table{width:100%;min-width:560px;border-collapse:collapse;table-layout:fixed}
th{font-weight:400;font-size:12px;color:var(--head);text-align:left;padding:4px 6px;border-bottom:1px solid var(--head);letter-spacing:.03em}
td{padding:5px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
tr.grp td{color:var(--head);font-size:13.33px;background:var(--tint);padding:4px 6px;letter-spacing:.02em}
.bx{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink);margin-top:1px}
.bx.on{background:var(--ink)}
.red{color:var(--red)}
.c-n{width:30px}.c-a{width:96px}.c-o{width:96px}.c-d{width:110px}.c-id{width:110px}
.ctr th:nth-child(n+3),.ctr td:nth-child(n+3){text-align:center}
.ctr .cap{display:block;margin:0 auto}
.ctr td.sui{padding-left:6px}
td.num{color:var(--head);font-variant-numeric:tabular-nums}

td.due,td.opr{font-size:12px;padding-top:7px}
td.sui{font-size:12px;padding-top:7px;padding-left:12px;color:var(--ink)}
.printonly{display:none}
.alabel{font-size:12px;color:var(--head);margin:14px 0 6px;letter-spacing:.03em}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.atile{border:1px solid var(--rule);border-radius:3px;padding:5px 6px;display:grid;gap:1px;min-width:0}
.alab{font-size:12px;color:var(--head)}
.aval{font-family:var(--f-title);font-weight:600;font-size:18px;color:#000;font-variant-numeric:tabular-nums}
.asub{font-size:12px;color:var(--ink);white-space:nowrap}.c-trig{width:190px}
.cap{font:inherit;font-size:14.67px;color:var(--ink);width:100%;max-width:84px;box-sizing:border-box;border:0;border-radius:2px;background:#E9EAEA;padding:3px 6px;font-variant-numeric:tabular-nums}
.cap:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cap::placeholder{color:#8A8D8F}
.btn{font:inherit;font-size:13.33px;line-height:1.2;box-sizing:border-box;height:36px;color:var(--blue);background:var(--paper);border:1px solid var(--blue);border-radius:3px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center}
.acts{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px}
.btn:hover{background:var(--tint)}
a.btn{text-decoration:none}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.notice{font-size:13.33px;color:var(--ink);margin:10px 0 0}
.rec{font-size:9px;color:var(--head);margin:8px 0 0;word-break:break-all;font-family:"Courier New",monospace}
.note{font-size:12px;color:var(--ink);margin:8px 0 0;max-width:80ch}
.key{font-size:12px;color:var(--head);margin:10px 0 0}
h3{font-weight:400;font-size:14.67px;color:var(--head);margin:18px 0 6px;letter-spacing:.02em}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule)}
.grid3>div{padding:8px 10px;border-right:1px solid var(--rule);font-size:13.33px;min-width:0}
.grid3>div:last-child{border-right:0}
.grid3 .lab{display:block;color:var(--head);font-size:12px;margin-bottom:3px}
.src{columns:2;column-gap:28px;font-size:12px;line-height:1.5;margin:0;padding:0;list-style:none}
.src li{break-inside:avoid;border-bottom:1px solid var(--tint)}
.refs td{font-size:12px;padding:3px 6px}
@media (max-width:640px){.grid3{grid-template-columns:1fr}.grid3>div{border-right:0;border-bottom:1px solid var(--rule)}.src{columns:1}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.areas{grid-template-columns:repeat(auto-fill,minmax(68px,1fr))}}
@media print{
  @page{size:letter;margin:0.5in}
  .pick,.notice{display:none}
  .cap::placeholder{color:transparent}
  .c-n{width:22px}.c-a{width:74px}.c-o{width:66px}.c-d{width:72px}.c-id{width:86px}
  td{font-size:13.33px;padding:4px 5px}td.sui{font-size:11px;white-space:nowrap;padding-left:8px}td.due{white-space:nowrap;font-size:12px}td.opr{font-size:12px}
  .kpi .val{font-size:18px;white-space:nowrap}.kpi{padding:8px 10px}.kpis{gap:6px}
  .asub{white-space:normal}.kpi,.atile{min-width:0;overflow:hidden}
  .amonth{font-size:26px}h1{font-size:26px}
  .cap{max-width:none}

  .areas{gap:4px}.atile{padding:4px}.aval{font-size:15px}.asub,.alab{font-size:10.5px}
  .wrap{max-width:none;padding:0 0.25in}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{min-width:0}
  tr{break-inside:avoid}
  section.month{break-before:page;margin-top:14px}
  section.month.first{break-before:auto}
  .tblbox{overflow:visible}
}
</style>
</head>

</div>

 {a:"D8",w:"Vehicle mishap",d:"Notify wing/region LG, LGT and CAP/GC",o:"CC",c:"48 hrs",r:"132-1 §10.4"},
 {a:"D8",w:"Tires reach 6 years",d:"Replace tires",o:"LG",c:"6 years",r:"132-1 ¶13.2.2"},
 {a:"E2",w:"Safety mishap",d:"Notify chain of command, not via CAPSIS",o:"Member",cT:"Promptly",r:"160-2 §6.3.1"},
 {a:"E2",w:"Safety mishap",d:"Enter in CAPSIS",o:"CC/SE",c:"48 hrs",r:"160-2 §6.6"},
 {a:"E2",w:"Safety mishap",d:"Safety review; set mitigation dates",o:"CC",c:"60 / 120 days",r:"160-2 §7.4, §8.2.1"},
 {a:"E2",w:"Non-routine event",d:"Deliberate risk assessment (CAPF 160)",o:"SE",c:"Before event",r:"160-1 §3.3.1"}
];

const PUBS=[["1-2","Publications Management","7 Nov 16"],["10-2","Files Maintenance and Records Disposition","16 Feb 11"],["20-3","Inspections and Compliance Analyses","18 May 26"],["30-1","Organization of Civil Air Patrol","13 Jan 20"],["35-1","Assignment and Duty Status","4 Jun 15"],["35-3","Membership Termination","27 Dec 12"],["36-1","CAP Nondiscrimination Program","14 May 26"],["39-2","Civil Air Patrol Membership","18 Aug 25"],["39-3","Award of CAP Medals, Ribbons and Certificates","28 Dec 12"],["40-1","Senior Member Education & Training","24 May 21"],["40-2","Testing Administration and Security","1 Jan 18"],["50-1","Aerospace Education Mission","9 Nov 20"],["60-1","Cadet Program Management","18 Aug 25"],["60-2","Cadet Protection Program","18 Aug 25"],["60-3","CAP ES Training and Operational Missions","26 Dec 12"],["80-1","The CAP Chaplain Corps","25 Jun 24"],["100-1","Radio Communications Management","6 Apr 16"],["120-1","Information Technology Security","1 Oct 17"],["132-1","CAP Vehicle Management","29 May 25"],["160-1","Safety Program","1 Nov 19"],["160-2","Safety Reporting and Review","28 Dec 22"],["173-1","Financial Procedures and Accounting","15 Nov 12"],["173-4","Fundraising/Donations","16 Dec 14"],["174-1","Property Management","26 Dec 12"],["190-1","Public Affairs Program","16 Nov 16"]];
const SUPPS=[["NER","OI 173-1 Financial Management (Travel)","1 Feb 23"],["NER","35-5 Supplement 1","10 Jan 19"],["NER","39-1 Supplement 1","25 Mar 26"],["NER","39-3 Supplement 1","25 Mar 26"],["NER","60-3(I) Supplement 1","25 Aug 26"],["NER","160-1 Supplement 1","14 Oct 25"],["NER","160-2 Supplement 1","18 Apr 23"],["NER","174-1 Supplement 1","15 Jul 24"],["VTWG","39-3 Supplement 1","3 Jun 25"],["VTWG","103-1 Supplement 1","11 Dec 25"],["VTWG","110-3 Supplement 1","14 May 26"],["VTWG","132-1 Supplement 1","10 Apr 26"],["VTWG","173-1 Supplement 1","27 Jan 26"],["VTWG","173-4 Supplement 1","19 May 23"]];

const OPRS=[["CC","Commander"],["CP","Cadet Programs"],["SE","Safety"],["LG","Logistics"],["DP","Personnel"],["DA","Administration"],["HC","Character Development"],["PA","Public Affairs"],["DOK","Communications"],["AE","Aerospace Education"],["FM","Finance"],["DO","Emergency Services"],["ET","Education and Training"],["IT","Information Technology"]];

// ================= LOGIC =================
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const areaName=k=>{const a=AREAS.find(x=>x[0]===k);return a[0]==="OPS"?a[1]:a[0]+" "+a[1];};
const inMonth=(t,m)=>(t.m==="all"||t.m.includes(m))&&!(t.skip||[]).includes(m);
const owns=(o,f)=>f==="all"||o.split("/").includes(f);
// ENTRY[m][id] = {c: CAPID, d: "YYYY-MM-DD", src: "typed" | "loaded"}. Held in memory only.
const ENTRY={};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const mdy=iso=>iso.length===10?iso.slice(5,7)+"/"+iso.slice(8,10)+"/"+iso.slice(2,4):iso;
const code=x=>x.ct?x.ct:(x.a==="OPS"?"Ops":x.a+(x.q?"-"+x.q:""));
const MABBR={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
const wkOf=d=>d<=7?1:d<=14?2:d<=21?3:4;
function sortKey(t,m,w){
  if(t.top) return 0;
  if(w) return w*100+10;
  const r=t.dueR||""; let d=null,mo=null,x;
  if((x=r.match(/^(\d{1,2})(st|nd|rd|th)\b/))) d=+x[1];
  else if((x=r.match(/^(\d{1,2}) ([A-Z][a-z]{2})\b/))){d=+x[1];mo=x[2].toLowerCase();}
  else if((x=r.match(/^([A-Z][a-z]{2}) (\d{1,2}),/))){d=+x[2];mo=x[1].toLowerCase();}
  if(d!==null&&(!mo||mo===m)) return wkOf(d)*100+30+d/100;
  return 900;
}
// INST[m][key] = {t, key, w}: one row on a month's sheet
const INST={};
function rowsFor(m,f){
  const out=[]; INST[m]=INST[m]||{};
  TASKS.filter(t=>inMonth(t,m)&&owns(t.o,f)).forEach(t=>{
    const ws=t.wkly?[1,2,3,4]:[0];
    ws.forEach(w=>{const key=w?t.id+"_w"+w:t.id;const r={t,key,w,k:sortKey(t,m,w)};INST[m][key]=r;out.push(r);});
  });
  const ai=k=>AREAS.findIndex(a=>a[0]===k);
  return out.sort((x,y)=>x.k-y.k||ai(x.t.a)-ai(y.t.a));
}
const info=(key,m)=>(ENTRY[m]&&ENTRY[m][key])||(DONE[m]&&DONE[m][key]?{d:DONE[m][key],src:"record"}:null);
const isDone=(key,m)=>!!info(key,m);
const counts=(m,f)=>{const list=rowsFor(m,f).filter(r=>!r.t.optional);return {n:list.length,d:list.filter(r=>isDone(r.key,m)).length};};
const dueTxt=r=>{const t=r.t;
  // Weekly rows show their week; hard dates show the date; everything else is "Monthly" (or its cycle).
  let lead;
  if(r.w) lead="Wk "+r.w;
  else if(/^Wk \d/.test(t.dueT||"")||/^This month/.test(t.dueT||"")) lead=(t.m==="all")?"Monthly":"This month";
  else lead=(t.dueT||"").replace(/\s*·\s*$/,"");
  if(lead) return t.dueR?'<span class="red">'+esc(lead)+'</span>':esc(lead);
  return t.dueR?'<span class="red">'+esc(t.dueR)+'</span>':"";};
const due=(r,m)=>{const i=info(r.key,m); return i?"Done "+esc(mdy(i.d).slice(0,5)):dueTxt(r);};
function idCell(r,m){
  const i=info(r.key,m);
  if(i&&i.src!=="typed") return esc(i.c||"");
  return '<input class="cap" type="text" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="CAPID for: '+esc(r.t.t.replace("{ROT}",ROTATION[m]))+(r.w?" (week "+r.w+")":"")+'" id="cap-'+m+'-'+r.key+'" data-m="'+m+'" data-id="'+r.key+'" value="'+(i?esc(i.c):"")+'" placeholder="CAPID">';
}
function recLine(m){
  const e=ENTRY[m]||{}; const items=Object.keys(e).filter(k=>e[k].src==="typed").map(k=>k+"-"+e[k].c+"-"+e[k].d.replace(/-/g,""));
  return items.length?"REC1:FY27:"+m+":"+items.join(",")+":END":"";
}

function monthSection(mo,f,first,single){
  const [m,name,q]=mo; let n=0, prev=null;
  const body=rowsFor(m,f).map(r=>{const g=Math.floor(r.k/100);const cut=prev!==null&&g!==prev;prev=g;return '<tr id="row-'+m+'-'+r.key+'"'+(cut?' class="wkcut"':'')+'><td class="num">'+(++n)+'</td><td>'+esc(r.t.t.replace("{ROT}",ROTATION[m]))+'</td><td class="due">'+due(r,m)+'</td><td class="opr">'+esc(r.t.o)+'</td><td>'+idCell(r,m)+'</td><td class="sui">'+esc(code(r.t))+'</td></tr>';}).join("");
  return '<section class="month'+(first?' first':'')+'"><div class="mhead'+(single?' printonly':'')+'"><h2>'+name+' · '+q+'</h2></div>'+
   (body?'<div class="tblbox"><table class="ctr"><colgroup><col class="c-n"><col><col class="c-d"><col class="c-o"><col class="c-id"><col class="c-a"></colgroup><thead><tr><th>#</th><th>Task</th><th>Due</th><th>OPR</th><th>CAPID</th><th>SUI</th></tr></thead><tbody>'+body+'</tbody></table></div>':'<p class="note">No tasks for this officer this month.</p>')+
   '<p class="rec" id="rec-'+m+'">'+recLine(m)+'</p></section>';
}
function anySection(f,first){
  const rows=[]; AREAS.forEach(([k])=>CLOCKS.filter(c=>c.a===k&&(f==="all"||c.o.split("/").includes(f)||["Adult","Member","Driver"].includes(c.o))).forEach(c=>rows.push(c)));
  const body=rows.map(c=>'<tr><td>'+esc(c.w)+'</td><td>'+esc(c.d)+'</td><td>'+esc(c.o)+'</td><td>'+(c.c?'<span class="red">'+esc(c.c)+'</span>':esc(c.cT))+'</td><td class="sui">'+esc(code(c))+'</td></tr>').join("");
  return '<section class="month'+(first?' first':'')+'"><div class="mhead"><h2>Any month: event deadlines</h2></div><div class="tblbox"><table><colgroup><col class="c-trig"><col><col class="c-o"><col class="c-d"><col class="c-a"></colgroup><thead><tr><th>When this happens</th><th>Do this</th><th>OPR</th><th>Clock</th><th>SUI</th></tr></thead><tbody>'+body+'</tbody></table></div></section>';
}
function refSection(first){
  let refs="";
  AREAS.forEach(([k])=>{
    const rows=TASKS.filter(t=>t.a===k).map(t=>[t.t.replace("{ROT}","(rotating area)"),t.r]).concat(CLOCKS.filter(c=>c.a===k).map(c=>[c.w+": "+c.d,c.r]));
    if(rows.length) refs+='<tr class="grp"><td colspan="2">'+esc(areaName(k))+'</td></tr>'+rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join("");
  });
  return '<section class="month'+(first?' first':'')+'"><div class="mhead"><h2>Sources and process</h2></div>'+
  '<h3>How a task is shown done</h3><p class="note">The member enters their CAPID on each task they finish; the box fills and the date stamps. They select Save PDF and save the file to the unit file share. Proof of the work is the eServices record where eServices holds it; anything else, one PDF or photo in SUI Evidence › (SUI area) › FY27. The CC loads the saved sheets with Load completed sheets and validates against eServices reports.</p>'+
  '<h3>SUI cycle</h3><div class="grid3"><div><span class="lab">Unit</span>NER-VT014 chartered Jan 27, 2026 (NER-VT006 de-chartered Jan 2026).</div><div><span class="lab">Self-SUI</span>Due <span class="red">Jan 27, 2027</span> (12-month midpoint; 20-3 allows 30 days after). To wing IG and Wing CC, and into DTS, within <span class="red">14 days</span>.</div><div><span class="lab">SUI</span>Due <span class="red">Jan 27, 2028</span>. Never past 27 months (Apr 27, 2028).</div></div>'+
  '<h3>SUI column</h3><p class="note">Area and worksheet question from the national SUI worksheets dated 1 Nov 2026 (for example D7-Q01). An area with no question number means the SUI does not inspect that task; it comes from a regulation or unit standard.</p>'+
  '<h3>References by task (CAPR unless noted)</h3><div class="tblbox"><table class="refs"><colgroup><col><col style="width:240px"></colgroup><tbody>'+refs+'</tbody></table></div>'+
  '<h3>National publications cited</h3><ul class="src">'+PUBS.map(p=>'<li>CAPR '+esc(p[0])+' '+esc(p[1])+' · '+esc(p[2])+'</li>').join("")+'</ul>'+
  '<h3>Supplements that apply</h3><ul class="src">'+SUPPS.map(p=>'<li>'+esc(p[0])+' '+esc(p[1])+' · '+esc(p[2])+'</li>').join("")+'</ul>'+
  '<p class="note">Supplements are listed by title and date; their contents are not yet folded in. Source of truth: titles and dates on the national publication indexes.</p>'+
  '<p class="note">OPR: '+OPRS.map(o=>o[0]+" "+o[1]).join(" · ")+'.</p></section>';
}

// ---- picks ----
const selM=document.getElementById("selMonth"), selO=document.getElementById("selOpr");
selM.innerHTML=MONTHS.map(m=>'<option value="'+m[0]+'">'+m[1]+'</option>').join("")+'<option value="all">All months</option><option value="any">Any month: event deadlines</option><option value="ref">Sources and process</option>';
selO.innerHTML='<option value="all">All officers</option>'+OPRS.map(o=>'<option value="'+o[0]+'">'+o[0]+' · '+o[1]+'</option>').join("");
const keys=MONTHS.map(m=>m[0]);
const nowKey=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"][new Date().getMonth()];
function fromHash(){
  const h=(location.hash||"").slice(1).toLowerCase().split("-");
  const opts=[...selM.options].map(o=>o.value);
  selM.value=opts.includes(h[0])?h[0]:nowKey;
  const o=(h[1]||"").toUpperCase(); selO.value=OPRS.some(x=>x[0]===o)?o:"all";
}
function toHash(){ const v=selM.value+(selO.value==="all"?"":"-"+selO.value.toLowerCase()); if(location.hash.slice(1)!==v) history.replaceState(null,"","#"+v); }

function kpis(m,f){
  // Every tile follows the Month picker: one month, or the whole FY when "All months" is chosen.
  const box=document.getElementById("kpis"), arw=document.getElementById("areawrap");
  const scope=keys.includes(m)?[m]:(m==="all"?keys:null);
  if(!scope){box.innerHTML="";box.hidden=true;arw.hidden=true;return;}
  box.hidden=false;arw.hidden=false;
  const tally=filt=>{let n=0,d=0;scope.forEach(mk=>rowsFor(mk,f).filter(r=>!r.t.optional&&filt(r)).forEach(r=>{n++;if(isDone(r.key,mk))d++;}));return {n,d};};
  const all=tally(()=>true), sf=tally(r=>r.t.safe);
  const pct=x=>x.n?Math.round(100*x.d/x.n)+"%":"–";
  const rem=x=>(x.n-x.d)+" of "+x.n+" tasks";
  const tile=(lab,val,sub)=>'<div class="kpi"><div class="lab">'+lab+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>';
  const label=scope.length===1?MONTHS.find(x=>x[0]===m)[1]:"FY2027";
  box.innerHTML=tile(label,pct(all),rem(all))+tile("Unit Safety",pct(sf),rem(sf))+tile("Next SUI action",SUI_NEXT.when,SUI_NEXT.what);
  document.getElementById("alabel").textContent=label+" by SUI area (done of tasks)";
  document.getElementById("areas").innerHTML=AREAS.map(([k,nm])=>{const x=tally(r=>r.t.a===k);
    if(!x.n) return ""; return '<div class="atile" title="'+esc(nm)+'"><span class="alab">'+(k==="OPS"?"Ops":k)+'</span><span class="aval">'+pct(x)+'</span><span class="asub">'+x.d+' of '+x.n+'</span></div>';}).join("");
}
function render(){
  const m=selM.value,f=selO.value;
  {const mo=MONTHS.find(x=>x[0]===m);document.getElementById("amonth").textContent=mo?mo[1].toUpperCase()+" "+(["oct","nov","dec"].includes(m)?"2026":"2027"):(m==="all"?"ALL MONTHS":"");} let out="",first=true;
  MONTHS.forEach(mo=>{ if(m==="all"||m===mo[0]){out+=monthSection(mo,f,first,m!=="all");first=false;} });
  if(m==="any"){out+=anySection(f,true);}
  if(m==="ref"){out+=refSection(true);}
  document.getElementById("main").innerHTML=out;
  kpis(m,f); toHash();
}
selM.addEventListener("change",render); selO.addEventListener("change",render);
document.getElementById("main").addEventListener("input",e=>{
  const el=e.target; if(!el.classList||!el.classList.contains("cap")) return;
  const v=el.value.replace(/\D/g,"").slice(0,6); if(v!==el.value) el.value=v;
  const m=el.dataset.m,id=el.dataset.id; ENTRY[m]=ENTRY[m]||{};
  if(v.length===6){ ENTRY[m][id]={c:v,d:today(),src:"typed"}; } else { delete ENTRY[m][id]; }
  const r=INST[m][id], row=document.getElementById("row-"+m+"-"+id);
  row.querySelector(".due").innerHTML=due(r,m);
  const rec=document.getElementById("rec-"+m); if(rec) rec.textContent=recLine(m);
  kpis(selM.value,selO.value);
});
const typedCount=()=>Object.values(ENTRY).reduce((a,e)=>a+Object.values(e).filter(x=>x.src==="typed").length,0);
window.addEventListener("beforeunload",e=>{ if(typedCount()){ e.preventDefault(); e.returnValue=""; } });
const baseTitle=document.title;
window.addEventListener("beforeprint",()=>{
  if(!typedCount()) return;
  const m=selM.value, mi=MONTHS.findIndex(x=>x[0]===m);
  const mm=mi<0?"ALL":String(((mi+9)%12)+1).padStart(2,"0")+"-"+m.toUpperCase();
  document.title="FY27-"+mm+"_"+(selO.value==="all"?"ALL":selO.value)+"_"+today();
});
window.addEventListener("afterprint",()=>{document.title=baseTitle;});
// ---- master: read completed sheets (PDF text) ----
document.getElementById("saveBtn").addEventListener("click",()=>window.print());
const loadBtn=document.getElementById("loadBtn"), loadFile=document.getElementById("loadFile"), loadMsg=document.getElementById("loadMsg");
loadBtn.addEventListener("click",()=>loadFile.click());
function pdfjs(){ return window.pdfjsLib?Promise.resolve(window.pdfjsLib):new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok(window.pdfjsLib);};sc.onerror=()=>no(new Error("The PDF reader did not load. Check the internet connection and try again."));document.head.appendChild(sc);}); }
loadFile.addEventListener("change",async()=>{
  const files=[...loadFile.files]; if(!files.length) return;
  loadMsg.hidden=false; loadMsg.textContent="Reading "+files.length+" sheet(s)…";
  let sheets=0,added=0,none=[];
  try{
    const lib=await pdfjs();
    for(const f of files){
      const doc=await lib.getDocument({data:await f.arrayBuffer()}).promise; let text="";
      for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();text+=tc.items.map(x=>x.str).join("");}
      const recs=[...text.replace(/\s+/g,"").matchAll(/REC1:FY27:([a-z]{3}):([a-z0-9_,\-]+):END/g)];
      if(!recs.length){none.push(f.name);continue;} sheets++;
      recs.forEach(r=>{const m=r[1];ENTRY[m]=ENTRY[m]||{};r[2].split(",").forEach(it=>{const p=it.split("-");if(p.length!==3||!/^\d{6}$/.test(p[1])||!/^\d{8}$/.test(p[2]))return;const d=p[2].slice(0,4)+"-"+p[2].slice(4,6)+"-"+p[2].slice(6,8);const cur=ENTRY[m][p[0]];if(!cur||d<cur.d){ENTRY[m][p[0]]={c:p[1],d,src:"loaded"};added++;}});});
    }
    loadMsg.textContent="Loaded "+sheets+" sheet(s), "+added+" completion(s)."+(none.length?" No checklist record found in: "+none.join(", ")+".":"");
  }catch(err){ loadMsg.textContent=err.message||"A sheet could not be read."; }
  loadFile.value=""; render();
});
window.addEventListener("hashchange",()=>{fromHash();render();});
fromHash(); render();
})();
</script>
