<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ES &amp; FEMA Test Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap">
<style>
/* ---- Study companion styles (diagrams), copied at build time ---- */
{{GUIDECSS}}
/* ---- Deck ---- */
:root{--yellow:#FFCD00;--letterbox:#26282B}
html,body{height:100%;overflow:hidden;background:var(--letterbox)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:50% 50%;background:var(--paper)}
.slide{position:absolute;inset:0;padding:30px 56px 0;display:flex;flex-direction:column;visibility:hidden;background:var(--paper);overflow:hidden}
.slide.on{visibility:visible}
.slide>header{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.dk-kick{margin:0;font-size:17px;color:var(--head);letter-spacing:.08em;text-transform:uppercase}
.dk-n{font-size:16px;color:var(--head)}
.slide h1{font-family:var(--f-title);font-weight:700;font-size:46px;line-height:1.02;color:var(--blue);margin:6px 0 0}
.vis{position:relative;flex:1;margin:16px 0 14px;min-height:0}
.fit{position:absolute;left:0;top:0;transform-origin:0 0}
.fit>.lab:first-child,.fit>p.lab:first-child{margin-top:0}
.fit .lab{margin-top:14px}
.take{margin:0 -56px;padding:16px 56px 18px;background:var(--blue);color:#fff;font-size:24px;line-height:1.25;border-top:6px solid var(--yellow)}
.notes{display:none}

/* title and divider slides */
.dk-title,.dk-div{justify-content:center;padding:0 96px}
.dk-title h1{font-size:76px;max-width:16ch}
.dk-rule{width:140px;height:8px;background:var(--yellow);margin:22px 0}
.dk-sub{margin:0;font-size:26px;color:var(--ink);max-width:40ch;line-height:1.3}
.dk-keys{position:absolute;left:96px;bottom:34px;margin:0;font-size:16px;color:var(--head)}
.dk-div{background:var(--blue)}
.dk-div .dk-kick{color:var(--yellow);font-size:22px}
.dk-div h1{color:#fff;font-size:88px}
.dk-div .dk-n{position:absolute;right:56px;top:30px;color:#fff}
.dk-chips{display:flex;gap:14px;flex-wrap:wrap}
.dk-chips span{font-family:var(--f-title);font-weight:700;font-size:30px;color:var(--blue);background:#fff;border-radius:3px;padding:8px 20px}

/* roadmap */
.dk-lanes .flow{margin-bottom:6px}
.flow.dk-half{width:40%}
/* IS-100 rules */
.dk-rules{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.dk-rc{border:1px solid var(--rule);border-top:3px solid var(--blue);border-radius:3px;padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.dk-rc>b{font-weight:400;color:#000;font-size:17px}
.dk-rc p{margin:0;font-size:14.67px;color:var(--ink)}
.dk-scale{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.dk-scale span{text-align:center;padding:7px 0;border:1px solid var(--hair);border-radius:3px;color:var(--head);font-size:16px}
.dk-scale span.in{background:var(--blue-t);border-color:var(--blue);color:var(--blue)}
.dk-scale span.best{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.dk-scl{display:grid;grid-template-columns:2fr 5fr 2fr;gap:4px;font-size:14.67px;color:var(--ink);text-align:center}
.dk-scl span:nth-child(2){color:var(--blue);font-weight:700}
.dk-uc{display:flex;flex-direction:column;align-items:center}
.dk-box{border:1.5px solid var(--blue);border-radius:3px;padding:5px 14px;color:var(--blue);font-size:15px}
.dk-box.me{background:var(--blue);color:#fff}
.dk-vl{width:2px;height:16px;background:var(--blue)}
.dk-say{display:flex;flex-direction:column;gap:6px}
.dk-say span{border-radius:3px;padding:6px 10px;font-size:15px}
.dk-say .yes{border:1.5px solid var(--blue);color:var(--blue)}
.dk-say .no{border:1px dashed var(--rule);color:var(--head);text-decoration:line-through}
.flow.dk-mini{gap:20px}
.flow.dk-mini .step{padding:6px 8px;align-items:center;justify-content:center}
.flow.dk-mini .sn{display:none}
.flow.dk-mini .step b{font-size:15px;text-align:center}
.dk-never{color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.dk-wheel .lnode{text-align:center;border-radius:16px;padding:6px 14px}
.dk-ex{display:block;font-weight:400;color:var(--ink);font-size:13.5px;margin-top:2px}
/* plain-language cards */
.dk-cards{display:grid;gap:14px}
.dk-card{border:1px solid var(--rule);border-top:3px solid var(--blue);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.dk-w{font-size:14px;color:var(--head);letter-spacing:.06em;text-transform:uppercase}
.dk-card b{font-family:var(--f-title);font-weight:700;font-size:22px;line-height:1.05;color:var(--blue)}
.dk-p{font-size:16px;color:#000;line-height:1.25}
.dk-like{margin-top:auto;padding-top:8px;border-top:1px dashed var(--rule);font-size:15px;color:var(--ink)}
.dk-cards+.zbar{margin-top:10px}
/* chips shared by types and ladder */
.dk-chip{justify-self:end;font-size:13.5px;padding:4px 10px;border-radius:3px;border:1px dashed var(--rule);color:var(--head);white-space:nowrap}
.dk-chip.on{background:var(--blue);border:1px solid var(--blue);color:#fff;font-weight:700}
/* incident types */
.dk-types{display:grid;gap:8px}
.dk-trow{display:grid;grid-template-columns:80px 220px 1fr 140px;gap:14px;align-items:center;border-bottom:1px solid var(--hair);padding-bottom:8px}
.dk-tl{font-family:var(--f-title);font-weight:700;font-size:22px;color:var(--blue)}
.dk-tb{height:16px;background:var(--tint);border-radius:2px}
.dk-tb span{display:block;height:100%;background:var(--blue);border-radius:2px}
.dk-te{font-size:15px;color:var(--ink)}
.dk-te b{display:block;font-weight:700;color:#000;font-size:17px}
.dk-tnote{margin:4px 0 0;font-size:14px;color:var(--head)}
/* leader ladder */
.dk-ladder{display:grid;gap:8px}
.dk-step{display:grid;grid-template-columns:200px 150px 1fr 130px;gap:12px;align-items:center;border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:3px;padding:8px 12px}
.dk-lv{font-size:14px;color:var(--head);letter-spacing:.06em;text-transform:uppercase}
.dk-step b{font-family:var(--f-title);font-weight:700;font-size:24px;color:var(--blue)}
.dk-lx{font-size:15px;color:var(--ink)}
/* handoff bar */
.dk-hand{display:grid;grid-template-columns:1fr auto 1fr;margin-top:18px;font-size:15px}
.dk-hand span{padding:8px 12px;background:var(--tint);color:var(--ink)}
.dk-hand span.in{background:var(--blue);color:#fff}
.dk-hand b{padding:8px 14px;background:var(--yellow);color:#000}
/* test-day plan slides */
.dk-day{border-collapse:collapse;width:100%}
.dk-day td{padding:10px 22px 10px 0;border-bottom:1px solid var(--rule);font-size:19px;color:var(--ink);white-space:nowrap}
.dk-day td.t{color:#000;font-weight:700;font-variant-numeric:tabular-nums}
.dk-day td.p,.dk-day td.f{font-family:var(--f-title);font-weight:700;font-size:23px;color:var(--blue)}
.dk-cyc{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.dk-cyc>div{border:1.5px solid var(--blue);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:center}
.dk-cyc .n{font-size:13px;color:var(--head)}
.dk-cyc b{font-family:var(--f-title);font-size:24px;color:var(--blue);line-height:1}
.dk-cyc .tm{font-weight:700;color:#000;font-size:16px}
.dk-cyc .a{font-size:15px;color:var(--ink)}
.dk-deb{grid-template-columns:repeat(3,1fr)}
.dk-deb b{font-size:30px}
.dk-deb .a{font-size:18px}
.aar3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.aar3 div{background:var(--blue-t);border-top:4px solid var(--yellow);padding:12px;font-size:18px;color:#000}
.dk-obj{margin:0 0 6px;font-size:22px;color:var(--blue);font-weight:700}
.dk-obj span{color:var(--head);font-weight:400}
.flow.dk-cflow .step{align-items:center;justify-content:center;padding:10px 6px}
.flow.dk-cflow .step b{font-size:18px;text-align:center}
.dk-s10 .covl{margin-bottom:28px}
.dk-s12 .fy{margin-bottom:14px}
.dk-s12 .fynote{margin-bottom:28px}
.dk-s12 .rtl{margin-top:0;margin-bottom:10px}
.dk-light{margin:22px 0 0;font-size:17px;color:var(--head)}
.dk-t19 .dk-card:nth-child(1){background:#E6E8F3}
.dk-t19 .dk-card:nth-child(2){background:#EEF0F0;border-top-color:var(--head)}
.dk-t19 .dk-card:nth-child(3){background:#FFF8D6;border-top-color:var(--yellow)}
.dk-t19 .tile{background:#F3F4F7;border-color:var(--silver)}
.dk-t20 .dk-card:nth-child(1){background:#D3D8EE}
.dk-t20 .dk-card:nth-child(2){background:#E1E4F3}
.dk-t20 .dk-card:nth-child(3){background:#EEF0F8}
.dk-t20 .dk-card:nth-child(4){background:#FFF8D6;border-top-color:var(--yellow)}
.dk-ring .ring{width:1000px;aspect-ratio:2.4;margin-top:30px;margin-bottom:30px}
.dk-ring .rcircle{aspect-ratio:2.4;width:60%}
.dk-ring .rnode{width:220px;padding:8px 12px}
.dk-ring .rnode b{font-family:var(--f-title);font-size:23px;line-height:1.05}
.dk-ring .rnode span:last-child{font-size:16px}
.dk-ring .rnode .sn{font-size:15px}
.dk-ring .rcenter b{font-size:26px}
.dk-ring .rcenter span{font-size:17px}
.dk-ring .rarr:nth-of-type(1){left:65.0% !important;top:24.0% !important;--r:13.5deg !important}
.dk-ring .rarr:nth-of-type(2){left:80.0% !important;top:50.0% !important;--r:90.0deg !important}
.dk-ring .rarr:nth-of-type(3){left:65.0% !important;top:76.0% !important;--r:166.5deg !important}
.dk-ring .rarr:nth-of-type(4){left:35.0% !important;top:76.0% !important;--r:-166.5deg !important}
.dk-ring .rarr:nth-of-type(5){left:20.0% !important;top:50.0% !important;--r:-90.0deg !important}
.dk-ring .rarr:nth-of-type(6){left:35.0% !important;top:24.0% !important;--r:-13.5deg !important}
.dk-ring .rcenter{background:#FFF8D6;border-radius:50%;padding:22px 18px;width:30%}
.dk-ring .rnode:nth-of-type(3),.dk-ring .rnode:nth-of-type(4),.dk-ring .rnode:nth-of-type(5),.dk-ring .rnode:nth-of-type(6){background:#E6E8F3;border:2px solid var(--red)}
.dk-ring .rnode:nth-of-type(7),.dk-ring .rnode:nth-of-type(8){background:#C9CEEA}
.dk-leg{display:flex;justify-content:center;gap:14px;margin-top:-14px}
.dk-leg span{font-size:16px;padding:5px 14px;border-radius:3px;color:#000}
.dk-leg .pre{background:#FFF8D6;border:1px solid var(--yellow)}
.dk-leg .dur{background:#E6E8F3;border:1px solid var(--blue)}
.dk-leg .post{background:#EEF0F0;border:1px solid var(--head)}
/* closing */
.dk-close{display:grid;gap:14px}
.dk-ct{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:14px;border:1px solid var(--rule);border-left:4px solid var(--blue);border-radius:3px;padding:12px 16px}
.dk-ct .sn{grid-row:1/3;align-self:center;font-size:30px}
.dk-ct b{font-weight:400;color:#000;font-size:19px}
.dk-ct span:last-child{font-size:16px;color:var(--ink)}

/* progress, notes drawer */
#prog{position:fixed;left:0;bottom:0;height:4px;background:var(--yellow);transition:width .2s}
#drawer{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:#111;color:#fff;padding:14px 24px 18px;font-size:20px;line-height:1.35;display:none;z-index:9}
body.shownotes #drawer{display:block}
#drawer h2{font-family:var(--f-title);font-size:22px;color:var(--yellow);margin:0 0 6px;border:0;padding:0;font-weight:700}
#drawer ul{margin:0;padding-left:1.2em}

/* presenter view (?presenter) */
#pv{display:none}
body.presenter{overflow:auto;background:#fff}
body.presenter #stage,body.presenter #prog{display:none}
body.presenter #pv{display:block;padding:24px 32px;max-width:1100px;margin:0 auto}
#pv .pvtop{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px solid var(--blue);padding-bottom:10px}
#pv .pvc{font-size:22px;color:var(--head)}
#pv .pvt{font-family:var(--f-title);font-weight:700;font-size:40px;color:var(--blue);margin:16px 0 4px;line-height:1.05}
#pv .pvk{font-size:16px;color:var(--head);letter-spacing:.08em;text-transform:uppercase;margin:0}
#pv .pvtake{font-size:22px;color:#000;border-left:6px solid var(--yellow);padding-left:12px;margin:14px 0}
#pv ul{font-size:24px;line-height:1.4;color:#000;padding-left:1.2em}
#pv .pvnext{font-size:18px;color:var(--head);border-top:1px solid var(--hair);padding-top:10px;margin-top:18px}
#pv .pvbtn{display:flex;gap:10px}
#pv .btn{height:44px;font-size:18px;padding:0 18px}
#pv .clock{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}

@page{size:1280px 720px;margin:0}
@media print{
 html,body{height:auto;overflow:visible;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 #stage{position:static;transform:none!important;height:auto}
 .slide{position:relative;visibility:visible;height:720px;break-after:page}
 #prog,#drawer,#pv{display:none!important}
}
</style>
</head>
<body>
<div id="stage">
{{SLIDES}}
</div>
<div id="prog"></div>
<div id="drawer" aria-live="polite"></div>
<div id="pv">
 <div class="pvtop"><span class="pvc"></span><span class="clock">0:00</span>
  <div class="pvbtn"><button class="btn" data-go="-1">Back</button><button class="btn" data-go="1">Next</button><button class="btn" id="treset">Reset timer</button></div></div>
 <p class="pvk"></p><p class="pvt"></p><p class="pvtake"></p><ul></ul><p class="pvnext"></p>
</div>
<script>
(() => {
  const slides = [...document.querySelectorAll(".slide")];
  const N = slides.length, stage = document.getElementById("stage");
  const presenter = new URLSearchParams(location.search).has("presenter");
  const ch = "BroadcastChannel" in window ? new BroadcastChannel("es-test-deck") : null;
  let cur = 0;
  if (presenter) document.body.classList.add("presenter");

  function scaleStage() {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  function fitAll() {
    slides.forEach(sl => {
      const box = sl.querySelector(".vis"), f = sl.querySelector(".fit");
      if (!box || !f) return;
      // Try narrower layouts: a short diagram laid out narrower can be scaled up further.
      const bw = box.clientWidth, bh = box.clientHeight, w0 = +f.dataset.w, wmin = +f.dataset.min;
      let best = w0, bs = 0;
      for (let w = w0; w >= wmin; w -= 40) {
        f.style.transform = "none"; f.style.width = w + "px";
        const s = Math.min(bw / w, bh / f.scrollHeight, 1.75);
        if (s > bs + 0.01) { bs = s; best = w; }
      }
      f.style.width = best + "px";
      const w = best, h = f.scrollHeight, s = bs;
      f.style.transform = `scale(${s})`;
      f.style.left = Math.max(0, (bw - w * s) / 2) + "px";
      f.style.top = Math.max(0, (bh - h * s) / 2) + "px";
    });
  }
  const txt = el => el ? el.innerHTML : "";
  function show(i, from) {
    cur = Math.max(0, Math.min(N - 1, i));
    slides.forEach((s, k) => s.classList.toggle("on", k === cur));
    document.getElementById("prog").style.width = ((cur + 1) / N * 100) + "%";
    const sl = slides[cur], notes = sl.querySelector(".notes");
    document.getElementById("drawer").innerHTML = `<h2>${cur + 1} / ${N} &middot; ${sl.dataset.title}</h2>` + txt(notes);
    if (location.hash !== "#" + (cur + 1)) history.replaceState(null, "", location.pathname + location.search + "#" + (cur + 1));
    if (presenter) {
      const pv = document.getElementById("pv"), nx = slides[cur + 1];
      pv.querySelector(".pvc").textContent = `Slide ${cur + 1} of ${N}`;
      pv.querySelector(".pvk").innerHTML = txt(sl.querySelector(".dk-kick"));
      pv.querySelector(".pvt").innerHTML = txt(sl.querySelector("h1"));
      pv.querySelector(".pvtake").innerHTML = txt(sl.querySelector(".take"));
      pv.querySelector(".pvtake").style.display = sl.querySelector(".take") ? "" : "none";
      pv.querySelector("ul").innerHTML = notes ? notes.querySelector("ul").innerHTML : "";
      pv.querySelector(".pvnext").innerHTML = nx ? "Next: " + nx.dataset.title : "Last slide";
    }
    if (ch && from !== "remote") ch.postMessage(cur);
  }
  const go = d => show(cur + d);

  addEventListener("keydown", ev => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const k = ev.key;
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { ev.preventDefault(); go(1); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { ev.preventDefault(); go(-1); }
    else if (k === "Home") show(0);
    else if (k === "End") show(N - 1);
    else if (k === "n" || k === "N") document.body.classList.toggle("shownotes");
    else if (k === "p" || k === "P") window.open(location.pathname + "?presenter#" + (cur + 1), "esdeck-presenter", "width=1100,height=760");
    else if (k === "f" || k === "F") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); }
  });
  stage.addEventListener("click", ev => {
    if (ev.target.closest("a")) return;
    const r = stage.getBoundingClientRect();
    go(ev.clientX < r.left + r.width * 0.3 ? -1 : 1);
  });
  let tx = null;
  addEventListener("touchstart", ev => { tx = ev.touches[0].clientX; }, { passive: true });
  addEventListener("touchend", ev => {
    if (tx === null) return;
    const dx = ev.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
  });
  document.querySelectorAll("#pv [data-go]").forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));
  if (ch) ch.onmessage = m => show(m.data, "remote");

  let t0 = Date.now();
  document.getElementById("treset").addEventListener("click", () => { t0 = Date.now(); });
  if (presenter) setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    document.querySelector("#pv .clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  }, 1000);

  addEventListener("resize", scaleStage);
  addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n) show(n - 1, "remote"); });
  scaleStage();
  fitAll();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(fitAll);
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
