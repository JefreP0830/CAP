  :root {
    --u: #001489; --red: #BA0C2F; --silver: #9EA2A2; --section: #63666A;
    --body: #4D4D4D; --rule: #D9DBDB; --page: #EEF0F0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--body);
         font: 11pt/1.2 Arial, Helvetica, sans-serif; }
  .bar { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
         background: #FFFFFF; border-bottom: 3px solid var(--u); }
  .bar a { color: var(--u); }
  .bar h1 { flex: 1; margin: 0; font: 600 20pt/1.2 'Rajdhani', Arial, sans-serif; color: var(--u); }
  .bar button { font: 11pt Arial, Helvetica, sans-serif; color: #FFFFFF; background: var(--u);
                border: 0; border-radius: 4px; padding: 10px 22px; cursor: pointer; }
  .bar button:focus-visible, a:focus-visible { outline: 3px solid #FFCD00; outline-offset: 2px; }
  body { background: #FFFFFF; }
  main { max-width: 900px; margin: 0 auto; padding: 0 20px 32px; }
  p { margin: 0 0 6pt; }
  .lead { margin-top: 6pt; }
  .spacer { flex: 1; }
  .title { font: 600 30pt/1.2 'Rajdhani', Arial, sans-serif; color: var(--u); margin: 16pt 0 2pt; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; margin: 12pt 0 0; }
  .tile { font: 11pt/1.2 Arial, Helvetica, sans-serif; color: var(--body); background: #FFFFFF;
          border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12);
          padding: 8px 14px; min-width: 88px; text-align: left; cursor: pointer; }
  .tile .n { display: block; font: 600 20pt/1.1 'Rajdhani', Arial, sans-serif; color: var(--u); }
  .tile[aria-pressed="true"] { background: var(--u); border-color: var(--u); color: #FFFFFF; }
  .tile[aria-pressed="true"] .n { color: #FFFFFF; }
  .tile:focus-visible { outline: 3px solid #FFCD00; outline-offset: 2px; }
  .filtered { color: var(--section); margin: 0 0 12pt; }

  h2 { font: 600 20pt/1.2 'Rajdhani', Arial, sans-serif; color: var(--section);
       margin: 24pt 0 12pt; padding-bottom: 4pt; border-bottom: 2px solid var(--u); }
  .note { margin: -6pt 0 12pt; }
  .row { display: grid; grid-template-columns: 2fr 3fr; gap: 0 20px; margin: 0 0 16pt; break-inside: avoid; }
  .side { background: #F1F2F2; padding: 12px 16px; }
  .side h3 { font: bold 14pt/1.2 Arial, Helvetica, sans-serif; color: var(--u); margin: 0 0 4pt; }
  .side p { margin: 0; }
  .side .read { display: inline-block; margin-bottom: 8pt; }
  .body { padding: 12px 0; }
  .body p { margin: 0 0 12pt; }
  .body > :last-child { margin-bottom: 0; }
  .date { color: #000000; font-weight: bold; white-space: nowrap; }
  .phaseout { color: var(--red); font-weight: bold; white-space: nowrap; }
  .unclear { padding: 2pt 10px; border-left: 3px solid var(--red); }
  .caution { color: var(--red); }
  .read, .key { color: var(--u); }
  .lbl, .opr { color: #000000; font-weight: bold; }
  .row + .row { border-top: 1px solid #E4E6E6; padding-top: 16pt; }
  .label-inline { color: var(--section); }
  .bar-sep { color: var(--section); padding: 0 4px; }
  .how { padding-left: 1.2em; }
  .how li { margin: 0 0 6pt; }
  .how a { color: var(--u); }
  footer { margin-top: 12pt; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } .body { padding: 12px 4px 0; } }
  @page { size: Letter; margin: 0.6in; }
  @media print {
    .bar { display: none; }
    main { max-width: none; padding: 0; }
    .side { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

const OPRS = {AE: "Aerospace Education", CCC: "Command Chief", CP: "Cadet Programs", DO: "Operations", DP: "Personnel", IT: "Information Technology", LG: "Logistics"};
const oprName = k => OPRS[k] ? k + " (" + OPRS[k] + ")" : k;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const dates = s => esc(s)
  .replace(/\{\{([^}]+)\}\}/g, '<span class="phaseout">$1</span>')
  .replace(/\{([^}]+)\}/g, '<span class="date">$1</span>');
const para = items => items.map(dates).join(" ");

function changeCard(c) {
  return `<article class="row">
    <div class="side">
      <h3>${esc(c.title)}</h3>
      <a class="read" href="${c.link}" target="_blank" rel="noopener">${esc(c.linkText || "Official letter")}</a>
      <p>${esc(c.doc)}</p>
      <p>Dated ${esc(c.dated)}.</p>
      <p>OPR: <span class="opr">${esc(oprName(c.opr))}</span></p>
      <p>Starts: <span class="date">${esc(c.starts)}</span></p>
    </div>
    <div class="body">
      <p><span class="lbl">BLUF</span> <span class="bar-sep">|</span> ${para(c.changed)}</p>
      <p><span class="lbl">Application</span> <span class="bar-sep">|</span> ${dates(c.who)}</p>
      ${c.unclear ? `<p class="unclear"><span class="caution">AI Detected Caution</span> <span class="bar-sep">|</span> ${dates(c.unclear)}</p>` : ""}
    </div>
  </article>`;
}

function forecastCard(c) {
  return `<article class="row">
    <div class="side">
      <h3>${esc(c.title)}</h3>
      <a class="read" href="${c.link}" target="_blank" rel="noopener">Current rules</a>
      <p>${esc(c.doc)}</p>
      <p>Dated ${esc(c.current)}.</p>
      <p>Signed: Pending</p>
      <p>OPR: <span class="opr">${esc(oprName(c.opr))}</span></p>
      <p>Starts: <span class="date">No date announced</span></p>
    </div>
    <div class="body">
      <p><span class="lbl">First Seen</span> <span class="bar-sep">|</span> ${esc(c.firstSeen)} Odds: <span class="key">${esc(c.odds)}</span>.</p>
      <p><span class="lbl">Why</span> <span class="bar-sep">|</span> ${para(c.why)}</p>
      <p><span class="lbl">Expect</span> <span class="bar-sep">|</span> ${dates(c.expect)}</p>
      ${c.unclear ? `<p class="unclear"><span class="caution">AI Detected Caution</span> <span class="bar-sep">|</span> ${dates(c.unclear)}</p>` : ""}
    </div>
  </article>`;
}

document.getElementById("lead").innerHTML =
  "BLUF = bottom line up front. ICL = interim change letter. OPR = the national office in charge. Supplement = a wing or region add-on to a national rule. Start dates are in <span class=\"date\">bold</span>; phase-out deadlines are in <span class=\"phaseout\">red</span>.";
document.getElementById("checked").textContent = "Last checked: " + DATA.checked + ".";
document.getElementById("h-now").textContent = DATA.heading;
const MONTHS = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function startKey(s) {
  const p = s.split(" ");
  if (p.length === 3) return new Date(+p[2], MONTHS[p[1]], +p[0]).getTime();
  return new Date(+p[1], MONTHS[p[0]] + 1, 0).getTime(); // month only: last day
}
const posted = DATA.changes.slice().sort((a, b) => startKey(a.starts) - startKey(b.starts));
let opr = "";
function render() {
  const p = opr ? posted.filter(c => c.opr === opr) : posted;
  const f = opr ? DATA.next.filter(c => c.opr === opr) : DATA.next;
  document.getElementById("now").innerHTML = p.map(changeCard).join("");
  document.getElementById("next").innerHTML = f.length ? f.map(forecastCard).join("")
    : `<p class="filtered">No forthcoming changes for ${esc(opr)}.</p>`;
  const counts = {};
  posted.forEach(c => counts[c.opr] = (counts[c.opr] || 0) + 1);
  const tiles = [["", posted.length, "All posted"]].concat(
    Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b))
      .map(k => [k, counts[k], k]));
  document.getElementById("tiles").innerHTML = tiles.map(([k, n, label]) =>
    `<button type="button" class="tile" data-opr="${k}" aria-pressed="${k === opr}"><span class="n">${n}</span>${esc(label)}</button>`).join("");
}
document.getElementById("tiles").addEventListener("click", e => {
  const b = e.target.closest(".tile"); if (!b) return;
  opr = (b.dataset.opr === opr) ? "" : b.dataset.opr; render();
});
render();
document.getElementById("how").innerHTML = DATA.how
  .map(([t, u]) => u ? `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>` : `<li>${esc(t)}</li>`).join("");
document.getElementById("foot").textContent =
  "Short summaries only. The official letter always wins. Prepared by " + DATA.editor + ".";
